# E2E environment: PostgreSQL + Keycloak + the application itself, all in Docker,
# driven by Playwright (e2e-tests/). Deterministic by design:
#  - the app runs with a fixed clock (APP_CLOCK_FIXED_INSTANT) so dates/times in
#    tests are stable;
#  - data is reset by tearing down with -v; Flyway then reseeds the known state
#    (Field 1-6, 80 PLN/h, opening hours 14:00-23:00, bob/alice/admin users).
#
# Run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
#      docker compose -f docker-compose.e2e.yml up --build -d
services:
  e2e-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  e2e-keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the external hostname so issued tokens always carry the same `iss`
      # regardless of which leg contacted Keycloak (browser -> localhost:8081 vs
      # app container -> keycloak:8080 over the compose network). Without this,
      # the two legs mint incompatible issuer values and JWT validation fails.
      KC_HOSTNAME_URL: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      e2e-postgres:
        condition: service_healthy

  e2e-app:
    build: .
    environment:
      # Database (in-network)
      DB_URL: jdbc:postgresql://e2e-postgres:5432/reservation
      DB_USERNAME: reservation
      DB_PASSWORD: reservation
      # Keycloak container-to-container legs (server side)
      KEYCLOAK_TOKEN_URI: http://e2e-keycloak:8080/realms/reservation/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://e2e-keycloak:8080/realms/reservation/protocol/openid-connect/certs
      # Browser-facing legs (302 targets / post-logout)
      KEYCLOAK_AUTHORIZATION_URI: http://localhost:8081/realms/reservation/protocol/openid-connect/auth
      KEYCLOAK_END_SESSION_URI: http://localhost:8081/realms/reservation/protocol/openid-connect/logout
      JWT_ISSUER_URI: http://localhost:8081/realms/reservation
      # Explicit JWKS so JWT-decoder startup doesn't resolve OIDC metadata at
      # localhost:8081 (the browser-facing URL), which only exists on the host.
      JWT_JWK_SET_URI: http://e2e-keycloak:8080/realms/reservation/protocol/openid-connect/certs
      KC_WEB_CLIENT_SECRET: dev-web-secret
      # Deterministic time
      APP_CLOCK_FIXED_INSTANT: "2026-10-12T10:00:00Z"
    ports:
      - "8080:8080"
    depends_on:
      e2e-postgres:
        condition: service_healthy
      e2e-keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
