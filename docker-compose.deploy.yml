# Compose for the QNAP DEV environment (publicly reachable via myQNAPcloud
# DDNS + router port forwards; real production deployment with a real TLS
# gateway is deferred). NOT for local
# development (use docker-compose.yml). The image tag is injected by the
# deploy workflow; never reference 'latest'.
#
# It runs the app with the prod Spring profile (real OAuth2/JWT enforcement,
# no dev-key fallback) despite being a dev environment: the box is internet-
# exposed, so the security posture must be genuine.
#
# Runtime secrets come from an env file on the host (e.g. /opt/reservation/.env):
#   POSTGRES_PASSWORD=...
#   JWT_ISSUER_URI=http://dukescloud.myqnapcloud.com:8081/realms/reservation (public)
services:
  postgres:
    image: postgres:17-alpine
    container_name: reservation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - reservation-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: reservation-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Pin the external hostname so every issued token carries the same `iss`,
      # no matter which route reached Keycloak (Cloudflare tunnel vs. container
      # traffic). The tunnel terminates TLS; backend stays plain HTTP (dev mode).
      KC_HOSTNAME_URL: ${KC_PUBLIC_BASE_URL:?KC_PUBLIC_BASE_URL is required}
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Deliberate persistence: the realm (incl. rotated demo-user passwords)
      # survives container recreation; the import only re-applies when the
      # realm is absent. Postgres-backed Keycloak deferred (demo scale).
      - reservation-kcdata:/opt/keycloak/data
    ports:
      # HOST side 6681+8080: QTS's web admin owns 8080 on the NAS itself, so
      # we stop the hosts' own admin from conflicting with app and Keycloak.
      # Router maps external 8080/8081 -> internal NAS 6680/6681.
      - "6681:8080"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${RESERVATION_IMAGE:?RESERVATION_IMAGE is required (ghcr.io/owner/reservation-api:<sha>)}
    container_name: reservation-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/reservation
      DB_USERNAME: reservation
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI is required}
      KC_WEB_CLIENT_SECRET: ${KC_WEB_CLIENT_SECRET:?KC_WEB_CLIENT_SECRET is required}
      KEYCLOAK_AUTHORIZATION_URI: ${KEYCLOAK_AUTHORIZATION_URI:?KEYCLOAK_AUTHORIZATION_URI is required}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI:?KEYCLOAK_TOKEN_URI is required}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:?KEYCLOAK_JWK_SET_URI is required}
      KEYCLOAK_END_SESSION_URI: ${KEYCLOAK_END_SESSION_URI:?KEYCLOAK_END_SESSION_URI is required}
      # Kept for reverse-proxy/LAN access through non-default schemes;
      # ensures the OAuth2 callback derives from the visible scheme/host.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # HOST side 6680: QTS admin occupies 8080 on the NAS itself.
      - "6680:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  reservation-pgdata:
  reservation-kcdata:
