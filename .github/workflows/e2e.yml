# E2E suite — MANUAL TRIGGER ONLY.
#
# The Playwright suite is deliberately NOT part of the PR pipeline: it is slow
# (backend build + image build + browser matrix) and the owner runs it on
# demand. Launch it from the Actions tab:
#   Actions → E2E (Playwright, manual) → Run workflow → pick browsers → Run
name: E2E (Playwright, manual)

on:
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browsers to run'
        required: false
        default: 'chromium webkit'
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (Playwright, manual run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e-tests/requirements.txt

      - name: Install Playwright + browsers
        run: |
          pip install -r e2e-tests/requirements.txt
          python -m playwright install --with-deps ${{ github.event.inputs.browsers || 'chromium webkit' }}

      - name: Boot the deterministic e2e stack
        run: |
          docker compose -f docker-compose.e2e.yml down -v --remove-orphans
          docker compose -f docker-compose.e2e.yml up --build -d

      - name: Wait for app health + realm availability
        timeout-minutes: 5
        run: |
          for i in $(seq 1 60); do
            APP=$(docker inspect --format '{{.State.Health.Status}}' reservation-system-e2e-app-1 2>/dev/null || echo starting)
            # curl exits non-zero while Keycloak is still connection-resetting
            # (56); under bash -e that would kill the whole script immediately,
            # so tolerate the failure and only read the status code.
            KC=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/realms/reservation/.well-known/openid-configuration || true)
            [ "$APP" = "healthy" ] && [ "$KC" = "200" ] && echo "stack ready after ${i} polls" && exit 0
            sleep 5
          done
          docker compose -f docker-compose.e2e.yml logs --tail 50
          exit 1

      - name: Run Playwright e2e suite
        working-directory: e2e-tests
        run: |
          BROWSER_ARGS=""
          for b in ${{ github.event.inputs.browsers || 'chromium webkit' }}; do
            BROWSER_ARGS="$BROWSER_ARGS --browser $b"
          done
          pytest tests/test_responsive.py $BROWSER_ARGS -q

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
