name: Release (main)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: mvn verify on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build and verify
        run: ./mvnw -B -ntp verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-main
          path: target/surefire-reports/
          retention-days: 7

  image:
    name: Build, scan, push image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # GHCR requires lowercase image names; github.repository may contain uppercase
      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Supply chain (ADR with the pre-deploy plan): the image is built and
      # PUSHED ONCE as a candidate tag, scanned at exactly that ref, then
      # promoted to the immutable release tags via a manifest-level copy
      # (`imagetools create` — same bytes, same digest, no second build).
      # 'latest' is intentionally NOT produced.
      - name: Build and push candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan candidate image for vulnerabilities (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Promote scanned candidate to release tags
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:main \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          echo "candidate and release tags share one digest (model: scan-then-promote)"
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }} | head -20

      - name: Summary
        run: |
          echo "### Published image (candidate scanned before promotion)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "audit trail: candidate scan ref \\`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:candidate-${{ github.sha }}\\`" >> $GITHUB_STEP_SUMMARY
