name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # GitHub runners ship Docker; Testcontainers starts its own PostgreSQL container.
      # Keycloak is NOT required: the opt-in @Tag("keycloak") test stays excluded
      # (surefire excludedGroups=keycloak) and tests use the dev key + mock JWTs.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  e2e:
    name: e2e (Playwright, optional — not a required check)
    needs: verify
    # Optional: informational only. Failures do not block the merge;
    # branch protection requires only "mvn verify (unit + integration)".
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Build/verify results are cached upstream, but the source is identical;
      # Playwright only needs Python + the compose stack (the app image builds
      # inside compose via the repo Dockerfile).
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e-tests/requirements.txt

      - name: Install Playwright + browsers
        run: |
          pip install -r e2e-tests/requirements.txt
          python -m playwright install --with-deps chromium webkit

      - name: Boot the deterministic e2e stack
        run: |
          docker compose -f docker-compose.e2e.yml down -v --remove-orphans
          docker compose -f docker-compose.e2e.yml up --build -d

      - name: Wait for app health + realm availability
        timeout-minutes: 5
        run: |
          for i in $(seq 1 60); do
            APP=$(docker inspect --format '{{.State.Health.Status}}' reservation-system-e2e-app-1 2>/dev/null || echo starting)
            # curl exits non-zero while Keycloak is still connection-resetting
            # (56); under bash -e that would kill the whole script immediately,
            # so tolerate the failure and only read the status code.
            KC=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/realms/reservation/.well-known/openid-configuration || true)
            [ "$APP" = "healthy" ] && [ "$KC" = "200" ] && echo "stack ready after ${i} polls" && exit 0
            sleep 5
          done
          docker compose -f docker-compose.e2e.yml logs --tail 50
          exit 1

      - name: Run Playwright e2e suite
        working-directory: e2e-tests
        run: pytest tests/test_responsive.py --browser chromium --browser webkit -q

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
