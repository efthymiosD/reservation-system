name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # GitHub runners ship Docker; Testcontainers starts its own PostgreSQL container.
      # Keycloak is NOT required: the opt-in @Tag("keycloak") test stays excluded
      # (surefire excludedGroups=keycloak) and tests use the dev key + mock JWTs.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
