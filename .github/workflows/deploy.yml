name: Deploy to QNAP

# Deploys an exact, already-tested image SHA to the QNAP DEV environment
# (publicly reachable via myQNAPcloud DDNS + router port forwards; real prod
# with a TLS gateway and a proper domain is deferred). Run manually AFTER a
# Release workflow has pushed the SHA to GHCR. Rollback = re-run this
# workflow with the previous known-good SHA (also recorded on the host in
# .previous-image after every deploy).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Exact git SHA tag to deploy (from the Release workflow, e.g. 76040633ae54…)'
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: efthymiosd/reservation-system
  DEPLOY_DIR: ${{ vars.QNAP_DEPLOY_DIR || '/opt/reservation' }}
  # Public app hostname (GitHub variable):
  #   QNAP_PUBLIC_APP_URL e.g. http://dukescloud.myqnapcloud.com:8080
  # Used by the realm substitution AND the final public smoke test.
  APP_URL: ${{ vars.QNAP_PUBLIC_APP_URL }}

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to QNAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The dispatch input must be a bare 40-char commit SHA before it reaches
      # any shell (workflow-dispatch input injection guard).
      - name: Validate image tag input
        env:
          IMAGE: ghcr.io/efthymiosd/reservation-system:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9-]+/reservation-system:[0-9a-f]{40}$ ]] \
            || { echo "ERROR: image_tag must be a full 40-char git SHA"; exit 1; }
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 1a) Generate the QNAP realm: dev URLs -> public DDNS hostnames (app
      #     8080 / keycloak 8081), dev client secret -> the real one (B-4).
      #     JSON-aware transformation; validated; never printed or uploaded.
      #     The committed realm stays dev-valid.
      - name: Generate QNAP realm export
        env:
          APP_URL: ${{ vars.QNAP_PUBLIC_APP_URL }}
          AUTH_URL: ${{ vars.QNAP_PUBLIC_BASE_URL }}
          WEB_SECRET: ${{ secrets.KC_WEB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import re

          app_url = os.environ["APP_URL"].rstrip("/")
          auth_url = os.environ["AUTH_URL"].rstrip("/")
          web_secret = os.environ["WEB_SECRET"]

          src = pathlib.Path("keycloak/realm-export.json")
          out = pathlib.Path("keycloak/realm-export.qnap.json")

          raw = src.read_text(encoding="utf-8")
          dev_secret_count = raw.count("dev-web-secret")
          localhost_count = len(re.findall(r"http://localhost:\d+", raw))
          realm = json.loads(raw)

          for client in realm.get("clients", []):
              if client.get("secret") == "dev-web-secret":
                  client["secret"] = web_secret
              client["redirectUris"] = [
                  u.replace("http://localhost:8080", app_url) for u in client.get("redirectUris", [])
              ]
              client["webOrigins"] = [
                  o.replace("http://localhost:8080", app_url) for o in client.get("webOrigins", [])
              ]
              logout_uris = client.get("attributes", {}).get("post.logout.redirect.uris")
              if isinstance(logout_uris, str):
                  client["attributes"]["post.logout.redirect.uris"] = logout_uris.replace(
                      "http://localhost:8080", app_url
                  )

          for client in realm.get("clients", []):
              uris = json.dumps(client.get("redirectUris", [])) + json.dumps(client.get("webOrigins", []))
              assert "localhost" not in uris, f"unreplaced localhost URI in client {client.get('clientId')}"
              assert client.get("secret") != "dev-web-secret", f"unreplaced dev secret in client {client.get('clientId')}"

          tmp = out.with_suffix(".tmp")
          tmp.write_text(json.dumps(realm, indent=2), encoding="utf-8")
          json.loads(tmp.read_text(encoding="utf-8"))  # validate
          tmp.rename(out)

          # evidence WITHOUT secret contents
          print(f"realm generated: {dev_secret_count} dev secret(s) replaced, "
                f"{localhost_count} dev URL reference(s) rewritten, output {out}")
          PY
          grep -q "$APP_URL" keycloak/realm-export.qnap.json \
            || { echo "ERROR: no localhost URI was replaced — check QNAP_PUBLIC_APP_URL"; exit 1; }
          [ -s keycloak/realm-export.qnap.json ] || { echo "ERROR: empty generated realm"; exit 1; }

      # 1b) Sync compose file + generated realm to the QNAP (the QNAP never
      #     builds from source)
      - name: Copy deployment files to QNAP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.QNAP_DEPLOY_HOST }}
          username: ${{ secrets.QNAP_DEPLOY_USER }}
          key: ${{ secrets.QNAP_DEPLOY_SSH_KEY }}
          source: 'docker-compose.deploy.yml,keycloak/realm-export.qnap.json'
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 0
          overwrite: true

      # 2) Pull the exact SHA, (re)start the stack
      - name: Pull and start stack
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.QNAP_DEPLOY_HOST }}
          username: ${{ secrets.QNAP_DEPLOY_USER }}
          key: ${{ secrets.QNAP_DEPLOY_SSH_KEY }}
          script_path: scripts/qnap/deploy-remote.sh
          envs: IMAGE_TAG
          command_timeout: 10m
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}

      # 3) Health check + smoke tests (LAN + public DDNS door); failure ==
      #    failed deployment (with log tail in the remote output).
      - name: Compute smoke date on the runner (GNU date; QTS busybox differs)
        run: echo "FUTURE_DATE=$(date -u -d '+14 days' +%F)" >> "$GITHUB_ENV"

      - name: Health check and smoke test
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.QNAP_DEPLOY_HOST }}
          username: ${{ secrets.QNAP_DEPLOY_USER }}
          key: ${{ secrets.QNAP_DEPLOY_SSH_KEY }}
          script_path: scripts/qnap/smoke-remote.sh
          envs: FUTURE_DATE
          command_timeout: 10m

      # 4) Public door from a true external vantage point (the router's
      #    public URLs): language-agnostic health probe. Fails the deploy.
      - name: Public door smoke (runner vantage)
        run: |
          set -euo pipefail
          ok=""
          for i in $(seq 1 10); do
            if curl -sf -m 15 "$APP_URL/actuator/health" | grep -q '"status":"UP"'; then ok=yes; break; fi
            sleep 3
          done
          [ -n "$ok" ] || { echo "PUBLIC DOOR FAILED: $APP_URL unreachable (router forwards? DDNS? firewall?)"; exit 1; }
          echo "public door: UP"

      - name: Summary
        if: success()
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- image: \`${IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- app: $APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "- rollback: previous tag recorded on the host in \`${DEPLOY_DIR}/.previous-image\`" >> $GITHUB_STEP_SUMMARY
