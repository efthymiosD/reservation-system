name: Deploy to QNAP

# Deploys an exact, already-tested image SHA to the QNAP DEV environment
# (publicly reachable via the Cloudflare tunnel; real prod is deferred).
# Run manually AFTER a Release workflow has pushed the SHA to GHCR.
# Rollback = re-run this workflow with the previous known-good SHA.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Exact git SHA tag to deploy (from the Release workflow, e.g. 8f3a91c...)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to QNAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/efthymiosd/reservation-system:${{ inputs.image_tag }}
      DEPLOY_DIR: ${{ vars.QNAP_DEPLOY_DIR || '/opt/reservation' }}
      # Public hostnames behind the Cloudflare tunnel (GitHub variables):
      #   QNAP_PUBLIC_APP_URL  e.g. https://reservation.example.com  -> the app
      #   QNAP_PUBLIC_BASE_URL e.g. https://auth.example.com          -> Keycloak
      APP_URL: ${{ vars.QNAP_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v7

      # 1a) Generate the QNAP realm: dev URLs -> tunnel hostnames, dev client
      #     secret -> the real one (B-4). The committed realm stays dev-valid.
      - name: Generate QNAP realm export
        env:
          AUTH_URL: ${{ vars.QNAP_PUBLIC_BASE_URL }}
          WEB_SECRET: ${{ secrets.KC_WEB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          sed -e "s|http://localhost:8080|${APP_URL}|g" \
              -e "s|http://localhost:8081|${AUTH_URL}|g" \
              -e 's|dev-web-secret|${WEB_SECRET}|g' \
              keycloak/realm-export.json > keycloak/realm-export.qnap.json
          grep -q "${APP_URL}" keycloak/realm-export.qnap.json \
            || { echo "ERROR: no localhost URI was replaced — check QNAP_PUBLIC_APP_URL"; exit 1; }

      # 1b) Sync compose file + generated realm to the QNAP (the QNAP never builds from source)
      - name: Copy deployment files to QNAP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.QNAP_DEPLOY_HOST }}
          username: ${{ secrets.QNAP_DEPLOY_USER }}
          key: ${{ secrets.QNAP_DEPLOY_SSH_KEY }}
          source: 'docker-compose.deploy.yml,keycloak/realm-export.qnap.json'
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 0
          overwrite: true

      # 2-4) Pull the exact SHA, (re)start the stack
      - name: Pull and start stack
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.QNAP_DEPLOY_HOST }}
          username: ${{ secrets.QNAP_DEPLOY_USER }}
          key: ${{ secrets.QNAP_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}
            echo "RESERVATION_IMAGE=${{ env.IMAGE }}" > .env.image
            mv keycloak/realm-export.qnap.json keycloak/realm-export.json
            docker compose -f docker-compose.deploy.yml --env-file .env --env-file .env.image pull app
            docker compose -f docker-compose.deploy.yml --env-file .env --env-file .env.image up -d

      # 5) Wait for health; 6) smoke test; 7) fail the deployment if either fails
      - name: Health check and smoke test
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.QNAP_DEPLOY_HOST }}
          username: ${{ secrets.QNAP_DEPLOY_USER }}
          key: ${{ secrets.QNAP_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            BASE=http://localhost:8080

            echo "== Waiting for health =="
            ok=""
            for i in $(seq 1 40); do
              if curl -sf "$BASE/actuator/health" | grep -q '"status":"UP"'; then ok=yes; break; fi
              sleep 3
            done
            [ -n "$ok" ] || { echo "HEALTH CHECK FAILED"; docker logs reservation-api --tail 100; exit 1; }
            echo "health: UP"

            echo "== Smoke: public venue endpoint =="
            curl -sf "$BASE/api/public/venue" | grep -q . || { echo "SMOKE FAILED: /api/public/venue"; exit 1; }

            echo "== Smoke: availability requires authentication =="
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/availability?date=2026-09-10&start=10:00&durationMinutes=60")
            [ "$code" = "401" ] || { echo "SMOKE FAILED: /api/availability returned $code, expected 401"; exit 1; }

            echo "smoke tests passed for ${{ env.IMAGE }}"
