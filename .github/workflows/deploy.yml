name: Deploy to QNAP

# Deploys an exact, already-tested image SHA to the QNAP DEV environment,
# reachable via Tailscale Funnel (443 app / 8443 keycloak on
# <node>.<tailnet>.ts.net). The job runs ON the QNAP itself (self-hosted
# runner inside the LAN): no SSH hop, no router ports, no DDNS — the ISP
# line is CGNAT, so both directions dial outbound (runner -> GitHub, funnel
# carrier -> Tailscale edge). Run manually AFTER a Release workflow has
# pushed the SHA to GHCR. Rollback = re-run this workflow with the previous
# known-good SHA (also recorded on the host in .previous-image after every
# deploy).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Exact git SHA tag to deploy (from the Release workflow, e.g. 76040633ae54…)'
        required: true

permissions:
  contents: read

env:
  # Public funnel URLs (GitHub variables):
  #   QNAP_PUBLIC_APP_URL  e.g. https://reservation-qnap.<tailnet>.ts.net
  #   QNAP_PUBLIC_BASE_URL e.g. https://reservation-qnap.<tailnet>.ts.net:8443
  # Used by the realm substitution AND the funnel-door smoke checks.
  APP_URL: ${{ vars.QNAP_PUBLIC_APP_URL }}
  KC_URL: ${{ vars.QNAP_PUBLIC_BASE_URL }}
  DEPLOY_DIR: ${{ vars.QNAP_DEPLOY_DIR || '/opt/reservation' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to QNAP
    # Self-hosted runner container on the QNAP (host networking; docker.sock
    # and the deploy dir bind-mounted at the SAME path as on the host).
    runs-on: [self-hosted, reservation]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The dispatch input must be a bare 40-char commit SHA before it reaches
      # any shell (workflow-dispatch input injection guard).
      - name: Validate image tag input
        env:
          IMAGE: ghcr.io/efthymiosd/reservation-system:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9-]+/reservation-system:[0-9a-f]{40}$ ]] \
            || { echo "ERROR: image_tag must be a full 40-char git SHA"; exit 1; }
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 1) Generate the QNAP realm: dev URLs -> public funnel hostnames (app
      #    443 / keycloak 8443); the client secret is read from the HOST .env
      #    (never from GitHub) and never printed (B-4).
      - name: Generate QNAP realm export
        run: bash scripts/qnap/generate-realm.sh

      # 2) Sync compose file + generated realm into the deploy dir (local cp
      #    — the runner IS on the QNAP).
      - name: Copy deployment files to the deploy directory
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR/keycloak"
          cp docker-compose.deploy.yml "$DEPLOY_DIR/"
          cp keycloak/realm-export.qnap.json "$DEPLOY_DIR/keycloak/"

      # 3) Pull the exact SHA, (re)start the stack.
      - name: Pull and start stack
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          bash "$GITHUB_WORKSPACE/scripts/qnap/deploy.sh"

      # 4) Health check + smoke tests (LAN + both funnel doors); failure ==
      #    failed deployment (with log tail on health failure). FUTURE_DATE
      #    computed here (GNU date; QTS busybox dialects differ).
      - name: Compute smoke date on the runner (GNU date)
        run: echo "FUTURE_DATE=$(date -u -d '+14 days' +%F)" >> "$GITHUB_ENV"

      - name: Health check and smoke test
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          PUBLIC_APP_URL="$APP_URL" PUBLIC_KC_URL="$KC_URL" FUTURE_DATE="$FUTURE_DATE" \
            bash "$GITHUB_WORKSPACE/scripts/qnap/smoke.sh"

      - name: Summary
        if: success()
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- image: \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "- app: $APP_URL (funnel 443)" >> $GITHUB_STEP_SUMMARY
          echo "- keycloak: $KC_URL (funnel 8443)" >> $GITHUB_STEP_SUMMARY
          echo "- rollback: previous tag recorded on the host in \`$DEPLOY_DIR/.previous-image\`" >> $GITHUB_STEP_SUMMARY
