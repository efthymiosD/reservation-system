[pytest]
# NOTE: no --browser flags here. The browser matrix is passed explicitly:
#   CI:   pytest --browser chromium --browser webkit   (ci.yml)
#   local: pytest --browser chromium                   (default: chromium only)
addopts =
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
testpaths = tests
