<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('meta.serverError', ~{::section})}">
<head>
  <title>Something went wrong</title>
</head>
<body>
<section class="container py-5 text-center">
  <h1 class="display-6" th:text="#{error.5xx.title}">Something went wrong</h1>
  <p class="lead text-muted" th:text="#{error.5xx.lead}">An unexpected error occurred. Please try again — if the problem persists, contact the venue.</p>
  <a class="btn btn-primary" th:href="@{/}" th:text="#{loggedout.backHome}">Back to home</a>
</section>
</body>
</html>
