<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('meta.notFound', ~{::section})}">
<head>
  <title>Page not found</title>
</head>
<body>
<section class="container py-5 text-center">
  <h1 class="display-6" th:text="#{error.404.title}">404 — Page not found</h1>
  <p class="lead text-muted" th:text="#{error.404.lead}">The page you were looking for does not exist.</p>
  <a class="btn btn-primary" th:href="@{/}" th:text="#{loggedout.backHome}">Back to home</a>
</section>
</body>
</html>
