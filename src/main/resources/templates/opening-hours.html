<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Opening hours', ~{::section})}">
<head>
  <title>Opening hours</title>
</head>
<body>
<section class="container py-5">
  <h1 class="mb-1">Opening hours</h1>
  <p class="text-muted mb-4">Venue-local time (<span th:text="${venue.timezone}">Europe/Warsaw</span>).</p>

  <div class="col-lg-6">
    <table class="table table-hover align-middle">
      <thead>
      <tr>
        <th scope="col">Day</th>
        <th scope="col">Hours</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="entry : ${weeklyHours}">
        <th scope="row" th:text="${#strings.capitalize(#strings.toLowerCase(entry.key))}">Monday</th>
        <td th:if="${entry.value.present}"
            th:text="${entry.value.get.opensAt} + ' – ' + ${entry.value.get.closesAt}">14:00 – 23:00</td>
        <td th:unless="${entry.value.present}" class="text-muted">Closed</td>
      </tr>
      </tbody>
    </table>
  </div>

  <a class="btn btn-primary" th:href="@{/reserve}">Make a reservation</a>
</section>
</body>
</html>
