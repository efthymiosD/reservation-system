<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('About', ~{::section})}">
<head>
  <title>About</title>
</head>
<body>
<section class="container py-5">
  <h1 class="mb-3" th:text="${venue.name}">Venue</h1>
  <p class="lead" th:text="${venue.description}">Description</p>

  <img th:src="${#strings.isEmpty(siteContent['about.photo']) ? '/images/default_about_page.jpeg' : siteContent['about.photo']}"
       th:alt="${venue.name}"
       class="img-fluid rounded mb-4 w-100" style="max-height: 22rem; object-fit: cover;"
       onerror="this.style.display='none'">

  <div class="row g-4 mt-2">
    <div class="col-md-4">
      <h2 class="h5">Address</h2>
      <p class="text-muted" th:text="${venue.address}">Address</p>
      <a class="link-secondary"
         th:href="@{'https://www.google.com/maps/search/?api=1&query=' + ${#uris.escapeQueryParam(venue.address)}}"
         target="_blank" rel="noopener noreferrer">View on Google Maps&nbsp;&rarr;</a>
    </div>
    <div class="col-md-4">
      <h2 class="h5">Timezone</h2>
      <p class="text-muted">All bookings are scheduled in venue-local time
        (<span th:text="${venue.timezone}">Europe/Warsaw</span>).</p>
    </div>
    <div class="col-md-4">
      <h2 class="h5">Booking</h2>
      <p class="text-muted" th:text="${siteContent['about.booking.body'] ?: 'Reserve a field online — pick a date, start time and duration, and see the price before you confirm.'}">Reserve a field online — pick a date, start time and duration, and see the price before you confirm.</p>
      <a class="btn btn-primary btn-sm" th:href="@{/reserve}">Make a reservation</a>
    </div>
  </div>

  <div class="mt-4">
    <a class="link-secondary me-3" th:href="@{/contact}">Contact us</a>
    <a class="link-secondary" th:href="@{/}">Home</a>
  </div>
</section>
</body>
</html>
