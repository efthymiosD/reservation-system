<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Make a reservation', ~{::section})}">
<head>
  <title>Make a reservation</title>
</head>
<body>
<section class="container py-4">
  <h1 class="mb-1">Make a reservation</h1>
  <p class="text-muted">Pick a date, start time and duration, then select a field on the venue map.</p>

  <div th:if="${page.message != null}" class="alert alert-warning" role="status" th:text="${page.message}">message</div>

  <!-- Slot selection: plain GET form — changing the slot re-renders the page
       without JavaScript. The interactive selection (T6) enhances this. -->
  <form th:action="@{/reserve}" method="get" class="row g-3 align-items-end mb-2">
    <div class="col-6 col-md-3">
      <label for="date" class="form-label">Date</label>
      <input type="date" id="date" name="date" class="form-control"
             th:min="${page.minDate}" th:max="${page.maxDate}" th:value="${page.date}">
    </div>
    <div class="col-6 col-md-3">
      <label for="start" class="form-label">Start</label>
      <select id="start" name="start" class="form-select" th:disabled="${#lists.isEmpty(page.timeOptions)}">
        <option th:each="t : ${page.timeOptions}" th:value="${t}" th:text="${t}"
                th:selected="${t == page.startTime}">18:00</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label for="durationMinutes" class="form-label">Duration</label>
      <select id="durationMinutes" name="durationMinutes" class="form-select">
        <option th:each="d : ${page.durationOptions}" th:value="${d}"
                th:text="${d / 60} + ' h' + (${d % 60} > 0 ? ' ' + ${d % 60} + ' min' : '')"
                th:selected="${d == page.durationMinutes}">1 h</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <button type="submit" class="btn btn-outline-primary w-100">Update availability</button>
    </div>
  </form>

  <div th:fragment="map" th:replace="~{fragments/venue-map :: venue-map(${page.fields})}"></div>
  <div th:replace="~{fragments/venue-map :: legend}"></div>

  <div th:if="${#lists.isEmpty(page.fields)}" class="alert alert-info" role="status">
    No fields are available for the selected time. Try another start time or duration.
  </div>

  <div class="card mt-3" th:if="${page.price != null}">
    <div class="card-body d-flex flex-wrap justify-content-between align-items-center">
      <div>
        <div class="fw-bold">Selected slot</div>
        <div class="text-muted">
          <span th:text="${page.date}">2026-09-03</span>,
          <span th:text="${page.startTime}">18:00</span> –
          <span th:text="${page.startTime.plusMinutes(page.durationMinutes)}">19:30</span>
        </div>
      </div>
      <div class="text-end">
        <div class="fw-bold" th:text="${page.price.amount} + ' ' + ${page.price.currency}">150 PLN</div>
        <div class="text-muted small">calculated by the venue for this slot</div>
      </div>
      <!-- Submission (T6): requires an available field and an authenticated session;
           the backend revalidates everything. -->
      <button type="button" class="btn btn-primary btn-lg" disabled>Reserve</button>
    </div>
  </div>
</section>
</body>
</html>
