<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('My reservations', ~{::section})}">
<head>
  <title>My reservations</title>
</head>
<body>
<section class="container py-4">
  <h1 class="mb-4">My reservations</h1>

  <h2 class="h4">Upcoming</h2>
  <div th:if="${#lists.isEmpty(page.upcoming)}" class="alert alert-info" role="status">
    You have no upcoming reservations.
    <a th:href="@{/reserve}">Make a reservation</a>
  </div>
  <div class="mb-4">
    <div class="card mb-2" th:each="card : ${page.upcoming}">
      <div class="card-body d-flex flex-wrap justify-content-between align-items-center">
        <div>
          <div class="fw-bold" th:text="${card.fieldName}">Field 3</div>
          <div class="text-muted">
            <span th:text="${#temporals.format(card.date, 'd MMMM yyyy')}">12 September 2026</span>,
            <span th:text="${card.start}">18:00</span> – <span th:text="${card.end}">19:30</span>
          </div>
          <div class="small text-muted"
               th:text="${card.priceAmount} + ' ' + ${card.priceCurrency} + ' · ' + ${card.status}">150 PLN</div>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary btn-sm" th:href="@{/reservations/{id}/confirmation(id=${card.reference})}">View</a>
          <form th:if="${card.cancellable}" th:action="@{/my-reservations/{id}/cancel(id=${card.reference})}"
                method="post">
            <button type="submit" class="btn btn-outline-danger btn-sm">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <h2 class="h4">Earlier</h2>
  <div th:if="${#lists.isEmpty(page.past)}" class="alert alert-secondary" role="status">
    Nothing here yet.
  </div>
  <div>
    <div class="card mb-2" th:each="card : ${page.past}">
      <div class="card-body d-flex flex-wrap justify-content-between align-items-center">
        <div>
          <div class="fw-bold" th:text="${card.fieldName}">Field 3</div>
          <div class="text-muted">
            <span th:text="${#temporals.format(card.date, 'd MMMM yyyy')}">12 September 2026</span>,
            <span th:text="${card.start}">18:00</span> – <span th:text="${card.end}">19:30</span>
          </div>
          <div class="small text-muted"
               th:text="${card.priceAmount} + ' ' + ${card.priceCurrency} + ' · ' + ${card.status}">150 PLN · CANCELLED</div>
        </div>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/reservations/{id}/confirmation(id=${card.reference})}">View</a>
      </div>
    </div>
  </div>
</section>
</body>
</html>
