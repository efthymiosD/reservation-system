<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('meta.adminReservations', ~{::section})}">
<head>
  <title>Reservations — Admin</title>
</head>
<body>
<section class="container py-4">
  <h1 class="mb-4" th:text="#{admin.res.reservations}">Reservations</h1>

  <form th:action="@{/admin/reservations}" method="get" class="row g-3 align-items-end mb-3">
    <div class="col-md-4">
      <label for="status" class="form-label" th:text="#{admin.table.status}">Status</label>
      <select id="status" name="status" class="form-select">
        <option value="" th:selected="${page.selectedStatus == null}" th:text="#{admin.status.all}">All</option>
        <option th:each="s : ${T(com.decoupledx.reservation.reservation.adapter.api.ReservationStatus).values()}"
                th:value="${s}" th:text="#{${'status.' + s.name().toLowerCase()}}" th:selected="${s == page.selectedStatus}">ACTIVE</option>
      </select>
    </div>
    <div class="col-md-4">
      <button type="submit" class="btn btn-outline-primary" th:text="#{admin.filter}">Filter</button>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
      <tr>
        <th scope="col" th:text="#{admin.table.id}">Reservation id</th>
        <th scope="col" th:text="#{admin.table.customer}">Customer</th>
        <th scope="col" th:text="#{admin.table.customerId}">Customer id</th>
        <th scope="col" th:text="#{admin.table.field}">Field</th>
        <th scope="col" th:text="#{admin.table.when}">When (venue time)</th>
        <th scope="col" th:text="#{admin.table.price}">Price</th>
        <th scope="col" th:text="#{admin.table.status}">Status</th>
        <th scope="col" th:text="#{admin.table.action}">Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${page.items}">
        <td class="text-nowrap"><code th:text="${row.reference}">456af8d1…</code></td>
        <td th:text="${row.customerName != null ? row.customerName : '—'}">alice</td>
        <td><small class="font-monospace text-break" th:text="${row.customerId}">c4e3a411-…</small></td>
        <td th:text="${row.fieldName}">Field 1</td>
        <td class="text-nowrap" th:text="${row.date} + ' ' + ${row.startTime} + '–' + ${row.endTime}">2026-09-03 18:00–19:00</td>
        <td class="text-nowrap" th:text="${row.priceAmount} + ' ' + ${row.priceCurrency}">120.00 PLN</td>
        <td th:text="${row.displayStatus}">ACTIVE</td>
        <td>
          <form th:if="${row.cancellable}"
                th:action="@{/admin/reservations/{id}/cancel(id=${row.reference})}" method="post">
            <button type="submit" class="btn btn-outline-danger btn-sm" th:text="#{myres.cancel}">Cancel</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <nav class="d-flex align-items-center gap-2">
    <span class="text-muted" th:text="#{admin.table.totalPage(${page.total}, ${page.page})}">Total: 0 · page 0</span>
    <a class="btn btn-sm btn-outline-secondary"
       th:if="${page.page > 0}" th:href="@{/admin/reservations(status=${page.selectedStatus},page=${page.page - 1},size=${page.size})}" th:text="#{admin.pager.newer}">Newer</a>
    <a class="btn btn-sm btn-outline-secondary"
       th:if="${(page.page + 1) * page.size < page.total}"
       th:href="@{/admin/reservations(status=${page.selectedStatus},page=${page.page + 1},size=${page.size})}" th:text="#{admin.pager.older}">Older</a>
  </nav>
</section>
</body>
</html>
