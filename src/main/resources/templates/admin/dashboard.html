<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('meta.admin', ~{::section})}">
<head>
  <title>Admin</title>
</head>
<body>
<section class="container py-4">
  <h1 class="mb-4" th:text="#{admin.title}">Admin panel</h1>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card text-center h-100">
        <div class="card-body">
          <div class="display-6" th:text="${page.resources}">0</div>
          <div class="text-muted" th:text="#{admin.card.resources}">resources</div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center h-100">
        <div class="card-body">
          <div class="display-6" th:text="${page.activeReservations}">0</div>
          <div class="text-muted" th:text="#{admin.card.activeReservations}">active reservations</div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center h-100">
        <div class="card-body">
          <div class="display-6" th:text="${page.activeRecurringReservations}">0</div>
          <div class="text-muted" th:text="#{admin.card.activeRecurring}">active recurring reservations</div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-outline-primary" th:href="@{/admin/content}" th:text="#{admin.card.siteContent}">Site content</a>
    <a class="btn btn-outline-primary" th:href="@{/admin/map}" th:text="#{admin.card.fieldCustomization}">Field customization</a>
    <a class="btn btn-outline-primary" th:href="@{/admin/pricing}" th:text="#{admin.card.pricing}">Pricing</a>
    <a class="btn btn-outline-primary" th:href="@{/admin/reservations}" th:text="#{admin.card.reservations}">Reservations</a>
    <a class="btn btn-outline-primary" th:href="@{/admin/recurring-reservations}" th:text="#{admin.card.recurring}">Recurring reservations</a>
  </div>
</section>
</body>
</html>
