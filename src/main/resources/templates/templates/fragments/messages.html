<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="messages">
  <div th:if="${message}" class="container mt-3">
    <div class="alert alert-info" role="status" th:text="${message}">message</div>
  </div>
  <div th:if="${error}" class="container mt-3">
    <div class="alert alert-danger" role="alert" th:text="${error}">error</div>
  </div>
</div>
</body>
</html>
