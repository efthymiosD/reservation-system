<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="venue-map(fields, canvasWidth, canvasHeight)" class="venue-map my-3" role="group"
     th:aria-label="#{map.ariaLabel}"
     th:attr="data-text-free=#{map.free}, data-text-reserved=#{map.reserved}, data-text-selected=#{map.selected}">
  <div class="venue-map__viewport scroll-x">
  <svg th:attr="viewBox='0 0 ' + (${canvasWidth} ?: 1200) + ' ' + (${canvasHeight} ?: 400)"
       class="venue-map__svg" role="img" th:aria-label="#{map.svgAriaLabel}">
    <!-- soft venue background -->
    <rect x="0" y="0" th:attr="width=${canvasWidth} ?: 1200, height=${canvasHeight} ?: 400" class="venue-map__background" rx="8"/>

    <g th:each="field : ${fields}"
       th:class="'resource resource--' + ${field.statusClass}"
       th:attr="role='button', tabindex=0, aria-label=${field.ariaLabel}, data-resource-id=${field.resourceId}, data-label=${field.label}"
       th:aria-disabled="${field.statusClass != 'available'}">
      <rect th:x="${field.x}" th:y="${field.y}"
            th:width="${field.width}" th:height="${field.height}" rx="10"/>
      <text class="resource__label" th:x="${field.x + field.width / 2}" th:y="${field.y + 60}"
            th:text="${field.label}">Field</text>
      <text class="resource__state" th:x="${field.x + field.width / 2}" th:y="${field.y + 110}"
            th:switch="${field.statusClass}">
        <th:block th:case="available" th:text="#{map.free}">&#10003; free</th:block>
        <th:block th:case="reserved" th:text="#{map.reserved}">&#10005; reserved</th:block>
      </text>
    </g>
  </svg>
  </div>
</div>

<div th:fragment="legend" class="venue-legend d-flex flex-wrap gap-3 small my-2">
  <span class="venue-legend__item"><span class="dot dot--available" aria-hidden="true"></span> <th:block th:text="#{legend.available}">Available</th:block></span>
  <span class="venue-legend__item"><span class="dot dot--selected" aria-hidden="true"></span> <th:block th:text="#{legend.selected}">Selected</th:block></span>
  <span class="venue-legend__item"><span class="dot dot--reserved" aria-hidden="true"></span> <th:block th:text="#{legend.reserved}">Reserved</th:block></span>
</div>

</body>
</html>
