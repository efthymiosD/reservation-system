<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navigation" class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">⚽ Five-a-Side Centre</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/about}">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/reserve}">Make a reservation</a>
        </li>
        <li class="nav-item" th:if="${currentUser.authenticated}">
          <a class="nav-link" th:href="@{/my-reservations}">My reservations</a>
        </li>
        <li class="nav-item" th:if="${currentUser.administrator}">
          <a class="nav-link" th:href="@{/admin}">Admin</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item" th:if="${currentUser.authenticated}">
          <span class="navbar-text me-3">Signed in as
            <a href="#" class="fw-bold text-info text-decoration-none" tabindex="0" role="button"
               data-bs-toggle="popover" data-bs-trigger="hover focus"
               data-bs-placement="bottom" data-bs-html="true"
               th:title="'Signed in as ' + ${currentUser.displayName}"
               th:attr="data-bs-content=${'<div>' + 'Id: ' + (currentUser.customerId != null ? currentUser.customerId : '&mdash;') + '</div><div>Username: ' + currentUser.displayName + '</div><div>Email: ' + (currentUser.email != null ? currentUser.email : '&mdash;') + '</div>'}">
              <span th:text="${currentUser.displayName}">alice</span></a>
          </span>
        </li>
        <li class="nav-item" th:if="${currentUser.authenticated}">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
          </form>
        </li>
        <li class="nav-item" th:unless="${currentUser.authenticated}">
          <a class="btn btn-outline-light btn-sm" th:href="@{/oauth2/authorization/keycloak}">Log in</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
</body>
</html>
