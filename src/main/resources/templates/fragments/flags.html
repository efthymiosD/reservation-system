<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Inline SVG flags for the navigation language selector. 60x42 viewBox,
     rounded corners via clipPath, crisp at 18px rendered width, no external
     assets. One dispatcher fragment: flag(${langTag.toLowerCase()}). -->

<span th:fragment="flag(lang)" th:switch="${#strings.toLowerCase(lang)}"><th:block th:case="en"><svg width="18" height="13" viewBox="0 0 60 42" class="flag-icon" role="img" aria-label="EN">
    <clipPath id="flag-en-clip"><rect width="60" height="42" rx="4"/></clipPath>
    <g clip-path="url(#flag-en-clip)">
      <rect width="60" height="42" fill="#012169"/>
      <path d="M0,0 60,42 M60,0 0,42" stroke="#fff" stroke-width="8"/>
      <path d="M0,0 60,42 M60,0 0,42" stroke="#C8102E" stroke-width="4"/>
      <path d="M30,0 V42 M0,21 H60" stroke="#fff" stroke-width="12"/>
      <path d="M30,0 V42 M0,21 H60" stroke="#C8102E" stroke-width="7"/>
    </g>
  </svg></th:block><th:block th:case="pl"><svg width="18" height="13" viewBox="0 0 60 42" class="flag-icon" role="img" aria-label="PL">
    <clipPath id="flag-pl-clip"><rect width="60" height="42" rx="4"/></clipPath>
    <g clip-path="url(#flag-pl-clip)">
      <rect width="60" height="21" fill="#fff"/>
      <rect y="21" width="60" height="21" fill="#DC143C"/>
    </g>
  </svg></th:block><th:block th:case="el"><svg width="18" height="13" viewBox="0 0 60 42" class="flag-icon" role="img" aria-label="EL">
    <clipPath id="flag-el-clip"><rect width="60" height="42" rx="4"/></clipPath>
    <g clip-path="url(#flag-el-clip)">
      <!-- 9 alternating blue/white stripes; white canton with a blue cross -->
      <rect width="60" height="42" fill="#0D5EAF"/>
      <g fill="#fff">
        <rect y="4.67"  width="60" height="4.67"/>
        <rect y="14"    width="60" height="4.67"/>
        <rect y="23.33" width="60" height="4.67"/>
        <rect y="32.67" width="60" height="4.67"/>
      </g>
      <rect width="22" height="22" fill="#fff"/>
      <rect x="8.6" width="4.8" height="22" fill="#0D5EAF"/>
      <rect y="8.6" width="22" height="4.8" fill="#0D5EAF"/>
    </g>
  </svg></th:block></span>
</body>
</html>
