spring:
  application:
    name: reservation-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USERNAME:reservation}
    password: ${DB_PASSWORD:reservation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  tomcat:
    accesslog:
      enabled: true
      directory: ${TOMCAT_ACCESSLOG_DIR:logs}
      pattern: common

logging:
  level:
    root: INFO
    com.decoupledx.reservation: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
  file:
    name: ${LOG_FILE:logs/reservation.log}
    max-size: 10MB
    max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/reservation}
    audience: ${APP_AUDIENCE:reservation-api}
    cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    dev-public-key: classpath:dev/jwt-public.pem
  venue:
    timezone: Europe/Warsaw

springdoc:
  swagger-ui:
    path: /swagger-ui.html
