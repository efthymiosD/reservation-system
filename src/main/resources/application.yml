spring:
  application:
    name: reservation-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USERNAME:reservation}
    password: ${DB_PASSWORD:reservation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KC_WEB_CLIENT_ID:reservation-web}
            client-secret: ${KC_WEB_CLIENT_SECRET:dev-web-secret}
            redirect-uri: ${KC_WEB_REDIRECT_URI:{baseUrl}/login/oauth2/code/keycloak}
            authorization-grant-type: authorization_code
            scope: openid
        # Explicit endpoints (not issuer-uri) so startup never fetches OIDC metadata:
        # integration tests must not require a running Keycloak.
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8081/realms/reservation/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/reservation/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/reservation/protocol/openid-connect/certs}
            user-name-attribute: sub

server:
  port: 8080
  tomcat:
    accesslog:
      enabled: true
      directory: ${TOMCAT_ACCESSLOG_DIR:logs}
      pattern: common

logging:
  level:
    root: INFO
    com.decoupledx.reservation: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
  file:
    name: ${LOG_FILE:logs/reservation.log}
    max-size: 10MB
    max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/reservation}
    audience: ${APP_AUDIENCE:reservation-api}
    cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    dev-public-key: classpath:dev/jwt-public.pem
    end-session-uri: ${KEYCLOAK_END_SESSION_URI:http://localhost:8081/realms/reservation/protocol/openid-connect/logout}
  venue:
    timezone: Europe/Warsaw

springdoc:
  swagger-ui:
    path: /swagger-ui.html
